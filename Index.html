<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobooth by: shypix.id</title>
  <!-- Tailwind CSS CDN for utility classes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-app transition-colors duration-500 text-slate-800 font-sans min-h-screen flex flex-col antialiased">
  <!-- Header -->
  <header class="py-4 px-6 flex justify-between items-center max-w-5xl mx-auto w-full">
    <div class="flex items-center gap-2">
      <div class="w-10 h-10 rounded-full bg-pink-400 text-white flex items-center justify-center font-bold text-xl shadow-md">
        <i data-lucide="camera" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-pink-600 tracking-tight flex items-center gap-1">
          Photobooth <span class="text-xs px-2 py-0.5 rounded-full bg-pink-100 text-pink-700 font-normal">v2.0</span>
        </h1>
        <p class="text-xs text-slate-500 font-medium">by: <span class="font-bold text-pink-500">shypix.id</span></p>
      </div>
    </div>
    
    <!-- Site Theme Picker -->
    <div class="flex items-center gap-2 bg-white/80 backdrop-blur px-3 py-1.5 rounded-full shadow-sm border border-slate-100">
      <i data-lucide="palette" class="w-4 h-4 text-pink-500"></i>
      <span class="text-xs font-medium text-slate-600 hidden sm:inline">Tema Web:</span>
      <div class="flex items-center gap-1.5" id="themePresets">
        <button onclick="setSiteTheme('pink')" class="w-5 h-5 rounded-full bg-pink-300 ring-2 ring-white hover:scale-110 transition-transform" title="Pink"></button>
        <button onclick="setSiteTheme('purple')" class="w-5 h-5 rounded-full bg-purple-300 ring-2 ring-white hover:scale-110 transition-transform" title="Purple"></button>
        <button onclick="setSiteTheme('mint')" class="w-5 h-5 rounded-full bg-teal-300 ring-2 ring-white hover:scale-110 transition-transform" title="Mint"></button>
        <button onclick="setSiteTheme('cream')" class="w-5 h-5 rounded-full bg-amber-200 ring-2 ring-white hover:scale-110 transition-transform" title="Cream"></button>
        <button onclick="setSiteTheme('blue')" class="w-5 h-5 rounded-full bg-sky-300 ring-2 ring-white hover:scale-110 transition-transform" title="Blue"></button>
        <button onclick="setSiteTheme('dark')" class="w-5 h-5 rounded-full bg-slate-800 ring-2 ring-white hover:scale-110 transition-transform" title="Dark"></button>
      </div>
      <input type="color" id="customSiteBg" onchange="setCustomSiteTheme(this.value)" class="w-5 h-5 rounded-full border-0 cursor-pointer overflow-hidden opacity-0 absolute w-5 h-5" title="Warna Custom">
      <label for="customSiteBg" class="w-5 h-5 rounded-full bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 border border-white cursor-pointer hover:scale-110 transition-transform shadow-sm" title="Custom Warna"></label>
    </div>
  </header>

  <!-- Main App Layout -->
  <main class="flex-1 max-w-5xl mx-auto w-full p-4 flex flex-col md:flex-row gap-6 items-start">
    
    <!-- LEFT PANEL: Live Preview & Capture Controls -->
    <div class="w-full md:w-7/12 flex flex-col gap-4">
      <div class="bg-white p-4 rounded-3xl shadow-sm border border-pink-100 flex flex-col items-center">
        
        <!-- Camera Container -->
        <div class="relative w-full aspect-[4/3] bg-slate-900 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center">
          <!-- MIRRORED Video Stream -->
          <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
          
          <!-- Flash Overlay -->
          <div id="flash" class="absolute inset-0 bg-white pointer-events-none opacity-0 transition-opacity duration-150 z-30"></div>
          
          <!-- Countdown Overlay -->
          <div id="countdown" class="hidden absolute inset-0 bg-black/30 backdrop-blur-sm z-20 flex items-center justify-center">
            <span id="countdownNumber" class="text-8xl font-black text-white animate-bounce drop-shadow-lg">3</span>
          </div>

          <!-- Mirror Indicator Tag -->
          <div class="absolute bottom-3 left-3 bg-black/40 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] text-white flex items-center gap-1 z-10">
            <i data-lucide="flip-horizontal" class="w-3 h-3"></i> Tampilan Mirror (Aktif)
          </div>

          <!-- Photo Counter Badge -->
          <div id="photoCounterBadge" class="hidden absolute top-3 right-3 bg-pink-500 text-white font-bold px-3 py-1 rounded-full text-xs shadow-md z-10 animate-pulse">
            Foto 1 / 4
          </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="w-full mt-4 flex flex-col gap-3">
          <div class="flex items-center justify-between gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-100">
            
            <!-- Timer Selector -->
            <div class="flex items-center gap-1">
              <span class="text-xs font-semibold text-slate-500 ml-1">Timer:</span>
              <button onclick="setTimer(3)" id="btnTimer3" class="px-2.5 py-1 text-xs rounded-xl font-bold bg-pink-500 text-white shadow-sm transition-all">3s</button>
              <button onclick="setTimer(5)" id="btnTimer5" class="px-2.5 py-1 text-xs rounded-xl font-bold bg-white text-slate-600 hover:bg-slate-100 transition-all">5s</button>
              <button onclick="setTimer(10)" id="btnTimer10" class="px-2.5 py-1 text-xs rounded-xl font-bold bg-white text-slate-600 hover:bg-slate-100 transition-all">10s</button>
            </div>

            <!-- Layout Selector -->
            <div class="flex items-center gap-1">
              <span class="text-xs font-semibold text-slate-500">Layout:</span>
              <button onclick="setLayout('strip4')" id="btnLayoutStrip4" class="px-2.5 py-1 text-xs rounded-xl font-bold bg-pink-500 text-white shadow-sm transition-all">4 Strip</button>
              <button onclick="setLayout('grid2x2')" id="btnLayoutGrid" class="px-2.5 py-1 text-xs rounded-xl font-bold bg-white text-slate-600 hover:bg-slate-100 transition-all">2x2 Grid</button>
              <button onclick="setLayout('single')" id="btnLayoutSingle" class="px-2.5 py-1 text-xs rounded-xl font-bold bg-white text-slate-600 hover:bg-slate-100 transition-all">Single</button>
            </div>
          </div>

          <!-- Capture Button -->
          <button id="captureBtn" onclick="startPhotoSequence()" class="w-full py-3.5 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold rounded-2xl shadow-lg shadow-pink-200 active:scale-95 transition-all flex items-center justify-center gap-2 text-base">
            <i data-lucide="camera" class="w-5 h-5"></i>
            <span>Mulai Foto!</span>
          </button>
        </div>

      </div>
    </div>

    <!-- RIGHT PANEL: Result & Live Customizer -->
    <div class="w-full md:w-5/12 flex flex-col gap-4">
      <div class="bg-white p-4 rounded-3xl shadow-sm border border-pink-100 flex flex-col gap-4">
        
        <div class="flex items-center justify-between border-b pb-2">
          <h2 class="font-bold text-slate-700 flex items-center gap-2 text-sm">
            <i data-lucide="sparkles" class="w-4 h-4 text-pink-500"></i> Hasil & Custom Frame
          </h2>
          <span class="text-[11px] text-pink-500 bg-pink-50 px-2 py-0.5 rounded-full font-medium">Bisa Di-edit Langsung!</span>
        </div>

        <!-- Frame Customization Tools -->
        <div class="space-y-3 bg-slate-50 p-3 rounded-2xl border border-slate-100 text-xs">
          
          <!-- Preset Frames -->
          <div>
            <label class="block font-semibold text-slate-600 mb-1.5">Preset Frame:</label>
            <div class="grid grid-cols-3 gap-1.5">
              <button onclick="applyPreset('pinkLove')" class="p-1.5 rounded-xl border border-pink-200 bg-pink-50 text-pink-700 font-medium hover:bg-pink-100">Pink Love</button>
              <button onclick="applyPreset('y2k')" class="p-1.5 rounded-xl border border-purple-200 bg-purple-50 text-purple-700 font-medium hover:bg-purple-100">Y2K Purple</button>
              <button onclick="applyPreset('minty')" class="p-1.5 rounded-xl border border-teal-200 bg-teal-50 text-teal-700 font-medium hover:bg-teal-100">Cute Mint</button>
              <button onclick="applyPreset('classic')" class="p-1.5 rounded-xl border border-slate-200 bg-white text-slate-700 font-medium hover:bg-slate-100">Classic White</button>
              <button onclick="applyPreset('darkMood')" class="p-1.5 rounded-xl border border-slate-700 bg-slate-800 text-white font-medium hover:bg-slate-700">Dark Mood</button>
              <button onclick="applyPreset('retro')" class="p-1.5 rounded-xl border border-amber-200 bg-amber-50 text-amber-800 font-medium hover:bg-amber-100">Retro Cream</button>
            </div>
          </div>

          <!-- Colors & Text -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold text-slate-600 mb-1">Warna Frame:</label>
              <div class="flex items-center gap-2">
                <input type="color" id="frameBgColor" value="#ffd1dc" onchange="updateFrameCustomization()" class="w-8 h-8 rounded-lg cursor-pointer border-0">
                <span id="frameBgHex" class="text-[10px] text-slate-400 uppercase font-mono">#FFD1DC</span>
              </div>
            </div>
            <div>
              <label class="block font-semibold text-slate-600 mb-1">Warna Teks:</label>
              <div class="flex items-center gap-2">
                <input type="color" id="frameTextColor" value="#db2777" onchange="updateFrameCustomization()" class="w-8 h-8 rounded-lg cursor-pointer border-0">
                <span id="frameTextHex" class="text-[10px] text-slate-400 uppercase font-mono">#DB2777</span>
              </div>
            </div>
          </div>

          <!-- Photo Filter & Custom Text -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold text-slate-600 mb-1">Filter Foto:</label>
              <select id="photoFilter" onchange="updateFrameCustomization()" class="w-full bg-white border border-slate-200 rounded-xl p-1.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-pink-300">
                <option value="none">Normal</option>
                <option value="warm">Warm Cute</option>
                <option value="soft">Soft Pink</option>
                <option value="bw">B&W Film</option>
                <option value="sepia">Sepia Vintage</option>
                <option value="vibrant">Vibrant</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold text-slate-600 mb-1">Teks Footer:</label>
              <input type="text" id="frameTextInput" value="by: shypix.id" oninput="updateFrameCustomization()" placeholder="Tulis teks..." class="w-full bg-white border border-slate-200 rounded-xl p-1.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-pink-300">
            </div>
          </div>
        </div>

        <!-- FIT-TO-SCREEN PHOTO PREVIEW CONTAINER -->
        <div class="relative w-full flex flex-col items-center justify-center bg-slate-100 rounded-2xl p-3 border border-slate-200 min-h-[300px]">
          
          <!-- Hidden Native Canvas for Rendering high-res PNG -->
          <canvas id="photoCanvas" class="hidden"></canvas>

          <!-- Scaled Compact Preview Image -->
          <div id="previewContainer" class="compact-preview-wrapper flex items-center justify-center w-full">
            <img id="resultImage" class="compact-preview shadow-md rounded-lg max-h-[360px] object-contain border border-white" alt="Hasil Photobooth" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400' viewBox='0 0 300 400'><rect width='100%' height='100%' fill='%23f8fafc'/><text x='50%' y='50%' font-family='sans-serif' font-size='14' fill='%2394a3b8' text-anchor='middle'>Klik 'Mulai Foto!' untuk mengambil gambar</text></svg>">
          </div>

        </div>

        <!-- Action Buttons -->
        <div class="flex gap-2">
          <button id="downloadBtn" disabled onclick="downloadPhoto()" class="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-1.5 text-xs">
            <i data-lucide="download" class="w-4 h-4"></i>
            <span>Simpan ke Galeri</span>
          </button>
        </div>

      </div>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-400 mt-auto">
    Web Photobooth • Created with <span class="font-bold text-pink-400">by: shypix.id</span>
  </footer>

  <!-- Sound Effects (Web Audio API fallback implemented in JS) -->
  <script src="script.js"></script>
</body>
</html>
